<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">

<style>
  .app { max-width: 760px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 16px calc(64px + env(safe-area-inset-bottom)); }

  /* Cabecera */
  .cabecera { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .cabecera h1 { font-size: 1.75rem; line-height: 1.15; margin: 0; letter-spacing: -.02em; }
  .cabecera p { margin: 6px 0 0; color: var(--texto-3); font-size: .9rem; }
  .btn-sec {
    flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px;
    font: inherit; font-size: .85rem; color: var(--texto-2);
    background: var(--superficie); border: 1px solid var(--borde); border-radius: 999px; cursor: pointer;
  }
  .btn-sec:hover { color: var(--texto); }
  .btn-sec:focus-visible, .chip:focus-visible, .fila a:focus-visible, .compartir:focus-visible, .tile:focus-visible, summary:focus-visible {
    outline: 2px solid var(--acento); outline-offset: 2px;
  }

  /* Buscador y filtros */
  .buscar { position: relative; margin: 22px 0 12px; }
  .buscar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--texto-3); pointer-events: none; }
  .buscar input {
    width: 100%; height: 46px; padding: 0 44px 0 42px;
    font: inherit; font-size: 16px; color: var(--texto);
    background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px;
  }
  .buscar input::placeholder { color: var(--texto-3); }
  .buscar input:focus { outline: 2px solid var(--acento); outline-offset: 1px; border-color: transparent; }
  .buscar kbd {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font: 500 .75rem var(--fuente); color: var(--texto-3);
    border: 1px solid var(--borde); border-radius: 6px; padding: 2px 7px;
  }
  @media (hover: none) { .buscar kbd { display: none; } }
  .buscar input:not(:placeholder-shown) + kbd { display: none; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px 4px; margin: 0 -16px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 34px; padding: 0 13px;
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: .88rem; color: var(--texto-2);
    background: var(--superficie); border: 1px solid var(--borde); border-radius: 999px; cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip b { font-weight: 500; color: var(--texto-3); font-size: .8rem; }
  .chip[aria-pressed="true"] { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
  .chip[aria-pressed="true"] b { color: inherit; opacity: .7; }

  /* Secciones */
  .seccion { margin-top: 28px; }
  .seccion > h2 {
    display: flex; align-items: baseline; gap: 8px;
    font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--texto-3); margin: 0 4px 10px;
  }
  .seccion > h2 .ico { font-size: 1rem; letter-spacing: 0; }

  /* Lo último */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tile {
    display: flex; flex-direction: column; gap: 10px; min-height: 128px; padding: 14px;
    text-decoration: none; color: inherit;
    background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio);
    box-shadow: var(--sombra); transition: transform .15s, box-shadow .15s;
  }
  .tile:hover { transform: translateY(-2px); }
  .tile .ico { font-size: 1.25rem; }
  .tile strong { font-size: .93rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tile small { margin-top: auto; color: var(--texto-3); font-size: .78rem; }

  /* Listas */
  .grupo { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); overflow: hidden; }
  .fila { position: relative; display: flex; align-items: stretch; }
  .fila + .fila { border-top: 1px solid var(--borde); }
  .fila a { flex: 1; min-width: 0; display: block; padding: 14px 4px 14px 16px; color: inherit; text-decoration: none; border-radius: inherit; }
  .fila a:hover .titulo { color: var(--acento); }
  .titulo { display: block; font-weight: 600; font-size: .98rem; line-height: 1.3; transition: color .12s; }
  .desc { display: block; margin-top: 3px; color: var(--texto-2); font-size: .87rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 7px; color: var(--texto-3); font-size: .78rem; }
  .etiqueta { padding: 2px 7px; border-radius: 999px; font-size: .7rem; font-weight: 600; letter-spacing: .02em; }
  .etiqueta.nuevo { background: var(--acento-suave); color: var(--acento); }
  .etiqueta.anterior { background: var(--superficie-2); color: var(--texto-3); border: 1px solid var(--borde); }
  .compartir {
    flex: none; width: 48px; display: grid; place-items: center;
    color: var(--texto-3); background: none; border: 0; cursor: pointer; border-radius: 10px;
  }
  .compartir:hover { color: var(--acento); }

  details.anteriores { border-top: 1px solid var(--borde); }
  details.anteriores > summary {
    list-style: none; cursor: pointer; padding: 11px 16px; font-size: .84rem; color: var(--texto-3);
    display: flex; align-items: center; gap: 6px; background: var(--superficie-2);
  }
  details.anteriores > summary::-webkit-details-marker { display: none; }
  details.anteriores > summary svg { transition: transform .15s; }
  details.anteriores[open] > summary svg { transform: rotate(90deg); }
  details.anteriores .fila { border-top: 1px solid var(--borde); background: var(--superficie-2); }
  details.anteriores .titulo { font-weight: 500; color: var(--texto-2); }

  .vacio { text-align: center; color: var(--texto-3); padding: 48px 16px; }
  .pie { margin-top: 40px; text-align: center; color: var(--texto-3); font-size: .78rem; line-height: 1.6; }

  .aviso {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    padding: 10px 16px; border-radius: 999px; font-size: .88rem;
    background: var(--texto); color: var(--fondo); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  .aviso.visible { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>
(function () {
  "use strict";

  const ICONOS = {
    buscar: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
    candado: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
    compartir: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M5 12v6.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V12"/></svg>',
    flecha: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'
  };

  let cat = null;          // catálogo descifrado
  let filtro = "todo";     // id de categoría o "todo"
  let consulta = "";

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const normalizar = (s) => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const url = (p) => "p/" + p.id + ".html";

  function fechaLinda(iso) {
    if (!iso) return "";
    const d = new Date(iso), hoy = new Date();
    const dias = Math.floor((new Date(hoy.toDateString()) - new Date(d.toDateString())) / 864e5);
    if (dias <= 0) return "Hoy";
    if (dias === 1) return "Ayer";
    if (dias < 7) return "Hace " + dias + " días";
    const opc = { day: "numeric", month: "short" };
    if (d.getFullYear() !== hoy.getFullYear()) opc.year = "numeric";
    return d.toLocaleDateString("es-AR", opc).replace(".", "");
  }
  const esNuevo = (iso) => iso && (Date.now() - new Date(iso)) < 7 * 864e5;

  function fila(p, conCategoria) {
    const c = cat.categorias.find((x) => x.id === p.categoria);
    const meta = [];
    if (conCategoria && c) meta.push(`<span>${esc(c.icono)} ${esc(c.nombre)}</span><span aria-hidden="true">·</span>`);
    meta.push(`<time datetime="${esc(p.fecha)}">${esc(fechaLinda(p.fecha))}</time>`);
    if (esNuevo(p.fecha) && !p.archivado) meta.push('<span class="etiqueta nuevo">Nuevo</span>');
    if (p.archivado) meta.push('<span class="etiqueta anterior">Versión anterior</span>');
    return `
      <div class="fila">
        <a href="${url(p)}">
          <span class="titulo">${esc(p.titulo)}</span>
          ${p.descripcion ? `<span class="desc">${esc(p.descripcion)}</span>` : ""}
          <span class="meta">${meta.join("")}</span>
        </a>
        <button class="compartir" type="button" data-id="${esc(p.id)}" aria-label="Compartir ${esc(p.titulo)}" title="Compartir">${ICONOS.compartir}</button>
      </div>`;
  }

  function render() {
    const cont = document.getElementById("contenido");
    const q = normalizar(consulta.trim());
    const porFecha = (a, b) => (b.fecha || "").localeCompare(a.fecha || "");

    // Chips con conteos (sin contar versiones anteriores)
    const activos = cat.paginas.filter((p) => !p.archivado);
    document.getElementById("chips").innerHTML =
      `<button class="chip" type="button" data-cat="todo" aria-pressed="${filtro === "todo"}">Todo <b>${activos.length}</b></button>` +
      cat.categorias.map((c) => {
        const n = activos.filter((p) => p.categoria === c.id).length;
        return n || cat.paginas.some((p) => p.categoria === c.id)
          ? `<button class="chip" type="button" data-cat="${esc(c.id)}" aria-pressed="${filtro === c.id}">${esc(c.icono)} ${esc(c.nombre)} <b>${n}</b></button>`
          : "";
      }).join("");

    // Búsqueda: lista plana por fecha, incluye versiones anteriores
    if (q) {
      const res = cat.paginas
        .filter((p) => filtro === "todo" || p.categoria === filtro)
        .filter((p) => normalizar(p.titulo + " " + p.descripcion + " " + (cat.categorias.find((c) => c.id === p.categoria) || {}).nombre).includes(q))
        .sort(porFecha);
      cont.innerHTML = res.length
        ? `<section class="seccion"><h2>${res.length} resultado${res.length === 1 ? "" : "s"}</h2><div class="grupo">${res.map((p) => fila(p, true)).join("")}</div></section>`
        : `<p class="vacio">Nada coincide con “${esc(consulta.trim())}”.</p>`;
      return;
    }

    let html = "";
    const cats = filtro === "todo" ? cat.categorias : cat.categorias.filter((c) => c.id === filtro);

    if (filtro === "todo") {
      const ultimos = activos.slice().sort(porFecha).slice(0, 4);
      html += `<section class="seccion"><h2>Lo último</h2><div class="tiles">` +
        ultimos.map((p) => {
          const c = cat.categorias.find((x) => x.id === p.categoria) || {};
          return `<a class="tile" href="${url(p)}"><span class="ico" aria-hidden="true">${esc(c.icono || "📄")}</span><strong>${esc(p.titulo)}</strong><small>${esc(fechaLinda(p.fecha))}</small></a>`;
        }).join("") + `</div></section>`;
    }

    for (const c of cats) {
      const todas = cat.paginas.filter((p) => p.categoria === c.id).sort(porFecha);
      if (!todas.length) continue;
      const vivas = todas.filter((p) => !p.archivado);
      const viejas = todas.filter((p) => p.archivado);
      html += `<section class="seccion" id="cat-${esc(c.id)}">
        <h2><span class="ico" aria-hidden="true">${esc(c.icono)}</span>${esc(c.nombre)}</h2>
        <div class="grupo">
          ${vivas.map((p) => fila(p)).join("")}
          ${viejas.length ? `<details class="anteriores"><summary>${ICONOS.flecha} Versiones anteriores (${viejas.length})</summary>${viejas.map((p) => fila(p)).join("")}</details>` : ""}
        </div>
      </section>`;
    }
    cont.innerHTML = html || '<p class="vacio">Todavía no hay nada acá.</p>';
  }

  let temporizador;
  function aviso(texto) {
    const el = document.getElementById("aviso");
    el.textContent = texto;
    el.classList.add("visible");
    clearTimeout(temporizador);
    temporizador = setTimeout(() => el.classList.remove("visible"), 2200);
  }

  async function compartir(id) {
    const p = cat.paginas.find((x) => x.id === id);
    const link = new URL(url(p), location.href).href;
    if (navigator.share) {
      try { await navigator.share({ title: p.titulo, url: link }); return; }
      catch (e) { if (e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(link); aviso("Link copiado"); }
    catch (e) { prompt("Copiá el link:", link); }
  }

  function montar() {
    document.body.classList.remove("bv-cargando");
    document.title = cat.sitio.titulo || "Archivo";
    const total = cat.paginas.length;
    document.body.innerHTML = `
      <div class="app">
        <header class="cabecera">
          <div>
            <h1>${esc(cat.sitio.titulo)}</h1>
            <p>${esc(cat.sitio.subtitulo ? cat.sitio.subtitulo + " · " : "")}${total} página${total === 1 ? "" : "s"}</p>
          </div>
          <button class="btn-sec" id="bloquear" type="button" title="Cierra la sesión en este dispositivo">${ICONOS.candado} Bloquear</button>
        </header>
        <div class="buscar">
          ${ICONOS.buscar}
          <input id="q" type="search" placeholder="Buscar" autocomplete="off" aria-label="Buscar páginas">
          <kbd>/</kbd>
        </div>
        <nav class="chips" id="chips" aria-label="Categorías"></nav>
        <div id="contenido"></div>
        <p class="pie">Actualizado ${esc(fechaLinda(cat.generado).toLowerCase())} · Todo el contenido viaja cifrado.</p>
      </div>
      <div class="aviso" id="aviso" role="status" aria-live="polite"></div>`;

    const q = document.getElementById("q");
    q.addEventListener("input", () => { consulta = q.value; render(); });
    document.getElementById("chips").addEventListener("click", (e) => {
      const b = e.target.closest(".chip");
      if (!b) return;
      filtro = b.dataset.cat;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.getElementById("contenido").addEventListener("click", (e) => {
      const b = e.target.closest(".compartir");
      if (b) compartir(b.dataset.id);
    });
    document.getElementById("bloquear").addEventListener("click", () => { Boveda.olvidar(); location.reload(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
      if (e.key === "Escape" && document.activeElement === q) { q.value = ""; consulta = ""; render(); q.blur(); }
    });
    render();
  }

  const datos = document.getElementById("bv-datos").textContent;
  Boveda.conClave(async (raw) => {
    const clave = await Boveda.importar(raw);
    cat = JSON.parse(await Boveda.descifrar(clave, datos));
    montar();
    return true;
  });
})();
</script>
</body>
</html>
