<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Vacantes para Mile — 16 de agosto</title>
<style>
:root{
  --navy:#1B3A5C;--navy2:#3A5F87;--amber:#C8781E;--amber2:#F0A94C;
  --cream:#FCFAF6;--ink:#2A3743;--muted:#70808F;--line:#E7E0D5;
  --green:#2E7D5B;--greenbg:#E8F2EC;--red:#B4443C;--redbg:#FBEAE8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--cream);color:var(--ink);font-size:16px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.hdr{background:linear-gradient(165deg,#24486E,#1B3A5C);color:#fff;padding:26px 22px 22px;text-align:center}
.hdr .k{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber2);font-weight:700;margin-bottom:8px}
.hdr h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:5px}
.hdr p{font-size:14px;color:#C3D4E5}
.prog{max-width:560px;margin:20px auto 0;padding:0 22px}
.pbar{height:6px;background:#EDE7DC;border-radius:6px;overflow:hidden}
.pfill{height:100%;background:var(--amber);border-radius:6px;transition:width .35s ease}
.pnum{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px;font-weight:600}
.stage{max-width:560px;margin:0 auto;padding:18px 22px 40px;position:relative}
.deck{position:relative;min-height:430px}
.card{position:absolute;inset:0;background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:24px 24px 20px;box-shadow:0 6px 28px rgba(27,58,92,.09);
  display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.2,.8,.3,1),opacity .32s ease;
  will-change:transform;overflow-y:auto}
.card.behind1{transform:scale(.965) translateY(11px);opacity:.55;z-index:1;pointer-events:none}
.card.behind2{transform:scale(.93) translateY(22px);opacity:.3;z-index:0;pointer-events:none}
.card.front{z-index:3}
.card.gone-y{transform:translateX(115%) rotate(11deg);opacity:0}
.card.gone-n{transform:translateX(-115%) rotate(-11deg);opacity:0}
.star{position:absolute;top:0;right:0;background:var(--amber);color:#fff;font-size:10.5px;font-weight:800;
  letter-spacing:.1em;padding:6px 13px;border-radius:0 19px 0 13px}
.jt{font-size:21px;font-weight:800;color:var(--navy);line-height:1.24;margin-bottom:4px;padding-right:70px}
.co{font-size:14.5px;color:var(--navy2);font-weight:600;margin-bottom:12px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:11px;padding:3px 9px;border-radius:20px;background:#F2EDE4;color:#5D6B79;font-weight:700}
.tag.new{background:#FCEBD5;color:#9C5A12}
.tag.sal{background:var(--greenbg);color:var(--green)}
.body{font-size:15px;line-height:1.55;flex:1}
.body p{margin-bottom:10px}
.body b{color:var(--navy)}
.gap{font-size:13px;color:var(--muted);line-height:1.48;background:#F8F5EF;
  border-radius:9px;padding:10px 12px;margin-top:4px}
.lk{display:inline-block;font-size:13.5px;color:var(--amber);font-weight:700;text-decoration:none;margin-top:12px}
.acts{max-width:560px;margin:0 auto;padding:4px 22px 34px;display:flex;gap:12px}
.btn{flex:1;border:none;border-radius:15px;padding:17px;font-size:16px;font-weight:800;letter-spacing:.03em;
  cursor:pointer;font-family:inherit;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.96)}
.no{background:var(--redbg);color:var(--red);border:2px solid #F0CFCB}
.yes{background:var(--green);color:#fff}
.hint{text-align:center;font-size:12.5px;color:var(--muted);padding:0 22px 30px}
.done{max-width:560px;margin:0 auto;padding:10px 22px 60px;display:none}
.done.on{display:block}
.dcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center}
.dcard h2{font-size:23px;font-weight:800;color:var(--navy);margin-bottom:10px}
.dcard p{font-size:15.5px;color:var(--ink);margin-bottom:16px}
.tally{display:flex;gap:12px;margin:18px 0 22px}
.tl{flex:1;border-radius:13px;padding:15px 8px}
.tl.y{background:var(--greenbg)}
.tl.n{background:var(--redbg)}
.tl .b{font-size:30px;font-weight:800;line-height:1}
.tl.y .b{color:var(--green)}.tl.n .b{color:var(--red)}
.tl .s{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.dl{display:block;width:100%;background:var(--navy);color:#fff;border:none;border-radius:15px;
  padding:18px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;margin-bottom:10px}
.dl:active{transform:scale(.98)}
.redo{background:none;border:none;color:var(--muted);font-size:13.5px;font-weight:600;
  cursor:pointer;font-family:inherit;text-decoration:underline;padding:8px}
.picked{text-align:left;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.picked h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);
  font-weight:800;margin-bottom:10px}
.pi{font-size:14.5px;padding:7px 0;border-bottom:1px solid #F2EDE4;line-height:1.4}
.pi b{color:var(--navy)}
.pi span{color:var(--muted);font-size:13px}
.foot{max-width:560px;margin:0 auto;padding:0 22px 50px;font-size:12.5px;color:var(--muted);line-height:1.5}
@media(min-width:620px){.deck{min-height:400px}}
</style>
</head>
<body>

<div class="hdr">
  <div class="k">16 de agosto</div>
  <h1>Diez vacantes para mirar</h1>
  <p>Todas en inglés. Ninguna pide neerlandés.</p>
</div>

<div class="prog">
  <div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>
  <div class="pnum" id="pn">1 de 10</div>
</div>

<div class="stage"><div class="deck" id="deck"></div></div>
<div class="acts" id="acts">
  <button class="btn no" onclick="decide(false)">✕&nbsp; No</button>
  <button class="btn yes" onclick="decide(true)">Sí&nbsp; ✓</button>
</div>
<div class="hint" id="hint">Arrastrá la tarjeta, o usá los botones. También andan las flechas ← →</div>

<div class="done" id="done">
  <div class="dcard">
    <h2>¡Listo!</h2>
    <p id="dmsg"></p>
    <div class="tally">
      <div class="tl y"><div class="b" id="ty">0</div><div class="s">te interesan</div></div>
      <div class="tl n"><div class="b" id="tn">0</div><div class="s">descartadas</div></div>
    </div>
    <button class="dl" onclick="descargar()">Descargar el archivo y pasárselo a Nico</button>
    <button class="redo" onclick="reiniciar()">Volver a empezar</button>
    <div class="picked" id="picked"></div>
  </div>
</div>

<div class="foot" id="foot"></div>

<script>
const FECHA = "2026-08-16";
const BUSQ_AMS = "https://englishjobsearch.nl/in/amsterdam/accounts-payable?sort=date";
const BUSQ_UTR = "https://englishjobsearch.nl/in/utrecht/accounting";

const JOBS = [
 {star:"Salió hoy", t:"Specialist Finance AR/AP", c:"Hoshizaki Europe B.V.", city:"Ámsterdam",
  tags:[["new","Publicada hoy"],["","Ámsterdam"],["sal","€42k–52k est."]], url:BUSQ_AMS,
  body:`<p><b>La más fresca y una de las que mejor te queda.</b> Piden experiencia práctica en cuentas por cobrar y por pagar, control de crédito y purchase ledger, de dos a cinco años.</p>
        <p>Procesar facturas de proveedores, matchearlas contra órdenes de compra, seguir facturas vencidas y conciliar cuentas de clientes. Es tu descripción de puesto, palabra por palabra.</p>`,
  gap:"Salió hoy, así que estarías entre las primeras en aplicar."},

 {star:"Encaje total", t:"Accounts Payable Clerk", c:"Mandarin Oriental · Conservatorium Hotel", city:"Ámsterdam",
  tags:[["","Ámsterdam"],["","Hotelería de lujo"],["sal","€40k–48k est."]], url:BUSQ_AMS,
  body:`<p><b>Piden literalmente lo que sos.</b> Título en contabilidad o finanzas, entre uno y dos años en AP, <b>preferentemente en hotelería</b>.</p>
        <p>Procesar facturas, documentación de AP y apoyo al cierre de mes con revisión de AP y accruals. De las diez, es donde tu perfil entra sin ninguna fricción.</p>`,
  gap:"Seguís dentro de hotelería, que es el sector que paga menos. Sirve como piso seguro, no como techo."},

 {star:"Para crecer", t:"Accounting Assistant", c:"Total Specific Solutions (TSS)", city:"Utrecht",
  tags:[["new","15 de agosto"],["","Utrecht"],["sal","€40k–50k est."]], url:BUSQ_UTR,
  body:`<p><b>Recién salida y con algo que casi nadie ofrece:</b> TSS tiene un programa interno de desarrollo en finanzas.</p>
        <p>Entrás a hacer lo que ya sabés y te forman para lo que sigue. Es exactamente el "equipo más grande donde crecer" que estás buscando.</p>`,
  gap:""},

 {star:"", t:"Accounting Assistant (EXIN)", c:"Software Improvement Group · IT internacional", city:"Utrecht",
  tags:[["","Utrecht"],["sal","€40k–48k est."]], url:BUSQ_UTR,
  body:`<p><b>Piden justo tu perfil:</b> título de grado en contabilidad o finanzas y mínimo dos años de experiencia contable.</p>
        <p>Y es tecnología, no hotelería, o sea que se paga distinto.</p>`,
  gap:"Usan Exact Online. Venís de Dynamics 365, que es equivalente y se aprende en semanas."},

 {star:"", t:"Accounts Payable Specialist — Payments", c:"CSL · farmacéutica global", city:"Ámsterdam",
  tags:[["new","3 de agosto"],["","Híbrido"],["sal","€44k–54k est."]], url:BUSQ_AMS,
  body:`<p><b>Farma es de los sectores que mejor pagan.</b> El foco está en la parte de pagos de AP: asegurar que salgan en tiempo y forma.</p>
        <p>Justo lo que empezaste a hacer con los batch payments.</p>`,
  gap:""},

 {star:"", t:"Client Accountant", c:"CSC Global · servicios corporativos", city:"Utrecht",
  tags:[["new","2 de agosto"],["","Utrecht"],["sal","€45k–55k est."]], url:BUSQ_UTR,
  body:`<p><b>Un escalón más arriba.</b> Contabilidad completa para una cartera de clientes: cierres, control de costos y seguimiento de cobros.</p>
        <p>Piden título de grado y entre tres y cuatro años.</p>`,
  gap:"Te falta un poco de antigüedad para el rango que piden. Aplicá igual: en contabilidad la experiencia real pesa más que los años en el papel."},

 {star:"", t:"Accounts Payable Accountant", c:"Airbus Defence and Space NL · vía BlueTrail", city:"Ámsterdam",
  tags:[["","Ámsterdam"],["sal","€44k–54k est."]], url:BUSQ_AMS,
  body:`<p><b>El proceso completo de cuentas por pagar</b> para el departamento de finanzas: registrar y procesar facturas entrantes, horas de contratistas y administración de pagos directos con la Agencia Espacial Europea.</p>`,
  gap:"Aeroespacial y defensa suele tener procesos más largos y controles de seguridad. Nada que te frene, pero no esperes respuesta rápida."},

 {star:"", t:"Bookkeeper / Finance Administrator", c:"upyield · híbrido Ámsterdam o Berlín", city:"Ámsterdam",
  tags:[["new","15 de agosto"],["","Híbrido"]], url:BUSQ_AMS,
  body:`<p><b>Finanzas del día a día en una empresa chica.</b> Facturas de compra y venta, cuentas por pagar y por cobrar, conciliaciones contables mensuales y control de crédito.</p>`,
  gap:"Empresa chica significa que tocás de todo, pero también que el equipo por encima tuyo puede ser corto. Preguntá en la entrevista cómo está armada el área."},

 {star:"", t:"Accounts Payable & Accounts Receivable Clerk", c:"WE Fashion · contrato temporal", city:"Utrecht",
  tags:[["new","10 de agosto"],["","Utrecht"],["","Temporal"]], url:BUSQ_UTR,
  body:`<p><b>AP y AR juntos, que es literalmente tu día.</b> Incluye el manejo de la master data de proveedores.</p>`,
  gap:"Es temporal. Lo pongo igual porque a veces los temporales en empresas grandes se convierten, pero vos decidís si vale."},

 {star:"", t:"Banking & Accounts Payable Administrator", c:"Ámsterdam", city:"Ámsterdam",
  tags:[["","Ámsterdam"],["sal","€40k–50k est."]], url:BUSQ_AMS,
  body:`<p><b>Mezcla bancos y cuentas por pagar</b>, incluidos <b>pagos manuales</b>, mantenimiento de datos de proveedores, resolución de consultas y apoyo al cierre de mes.</p>
        <p>Es prácticamente un listado de lo que hacés.</p>`,
  gap:"Es la más vieja de la lista y no pude confirmar el nombre de la empresa. Si la marcás, la verifico antes de armar nada."}
];

let i = 0;
const res = [];
const deck = document.getElementById('deck');

function render(){
  deck.innerHTML = '';
  for(let k = Math.min(i+2, JOBS.length-1); k >= i; k--){
    if(k >= JOBS.length) continue;
    const j = JOBS[k];
    const pos = k - i;
    const el = document.createElement('div');
    el.className = 'card ' + (pos===0 ? 'front' : pos===1 ? 'behind1' : 'behind2');
    el.innerHTML =
      (j.star ? `<div class="star">${j.star}</div>` : '') +
      `<div class="jt">${j.t}</div><div class="co">${j.c}</div>` +
      `<div class="meta">${j.tags.map(t=>`<span class="tag ${t[0]}">${t[1]}</span>`).join('')}</div>` +
      `<div class="body">${j.body}</div>` +
      (j.gap ? `<div class="gap">${j.gap}</div>` : '') +
      `<a class="lk" href="${j.url}" target="_blank" rel="noopener">Ver el aviso →</a>`;
    if(pos===0) el.id = 'front';
    deck.appendChild(el);
  }
  const pct = (i/JOBS.length)*100;
  document.getElementById('pf').style.width = pct + '%';
  document.getElementById('pn').textContent = Math.min(i+1, JOBS.length) + ' de ' + JOBS.length;
  attachDrag();
}

function decide(yes){
  if(i >= JOBS.length) return;
  const f = document.getElementById('front');
  res.push(Object.assign({}, JOBS[i], {si: yes}));
  if(f){ f.classList.add(yes ? 'gone-y' : 'gone-n'); }
  i++;
  setTimeout(()=>{ i < JOBS.length ? render() : finish(); }, 240);
}

function finish(){
  document.getElementById('deck').parentElement.style.display='none';
  document.getElementById('acts').style.display='none';
  document.getElementById('hint').style.display='none';
  document.getElementById('pf').style.width='100%';
  document.getElementById('pn').textContent='Terminado';
  const si = res.filter(r=>r.si);
  document.getElementById('ty').textContent = si.length;
  document.getElementById('tn').textContent = res.length - si.length;
  document.getElementById('dmsg').textContent = si.length === 0
    ? 'No marcaste ninguna esta vez. Mañana llega otra lista, no pasa nada.'
    : (si.length === 1 ? 'Marcaste una. Descargá el archivo y pasáselo a Nico.'
                       : 'Marcaste ' + si.length + '. Descargá el archivo y pasáselo a Nico.');
  document.getElementById('picked').innerHTML = si.length
    ? '<h3>Las que te interesan</h3>' + si.map(r=>`<div class="pi"><b>${r.t}</b><br><span>${r.c} · ${r.city}</span></div>`).join('')
    : '';
  document.getElementById('done').classList.add('on');
  window.scrollTo({top:0, behavior:'smooth'});
}

function csvCell(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }

function descargar(){
  const filas = [['Fecha','Puesto','Empresa','Ciudad','URL','Decision']];
  res.forEach(r=>filas.push([FECHA, r.t, r.c, r.city, r.url, r.si ? 'SI' : 'NO']));
  const csv = '﻿' + filas.map(f=>f.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Mile-seleccion-' + FECHA + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function reiniciar(){
  i = 0; res.length = 0;
  document.getElementById('done').classList.remove('on');
  document.getElementById('deck').parentElement.style.display='';
  document.getElementById('acts').style.display='flex';
  document.getElementById('hint').style.display='';
  render();
}

/* arrastrar */
let sx=0, sy=0, dragging=false, card=null;
function attachDrag(){
  card = document.getElementById('front');
  if(!card) return;
  card.addEventListener('pointerdown', e=>{
    if(e.target.tagName === 'A') return;
    dragging=true; sx=e.clientX; sy=e.clientY;
    card.style.transition='none'; card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx) < Math.abs(dy) && Math.abs(dy) > 14) return;
    card.style.transform = `translateX(${dx}px) rotate(${dx*0.05}deg)`;
    card.style.opacity = 1 - Math.min(Math.abs(dx)/460, .45);
  });
  const end = e=>{
    if(!dragging) return;
    dragging=false; card.style.transition='';
    const dx = e.clientX - sx;
    if(Math.abs(dx) > 95){ card.style.transform=''; card.style.opacity=''; decide(dx>0); }
    else { card.style.transform=''; card.style.opacity=''; }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

document.addEventListener('keydown', e=>{
  if(document.getElementById('done').classList.contains('on')) return;
  if(e.key==='ArrowRight') decide(true);
  if(e.key==='ArrowLeft') decide(false);
});

document.getElementById('foot').innerHTML =
  'Fuente: índice activo de englishjobsearch.nl, filtrado por Utrecht y Ámsterdam y ordenado por fecha. ' +
  'Descartadas por pedir neerlandés: 2. Descartadas por pedir más de cinco años: 6. ' +
  'Los enlaces llevan al listado donde está cada aviso: buscala por el nombre de la empresa.';

render();
</script>
</body>
</html>
